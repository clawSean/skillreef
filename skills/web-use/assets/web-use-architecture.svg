<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Web-use ownership and state architecture</title>
  <desc id="desc">A request enters the web-use router. Domain skills constrain intent and approvals, category references are loaded selectively, and specialist skills execute the chosen lane. Portable policy remains public while provider priority and proof remain private per machine. Every lane ends in verified result state.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#8294b2"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#42d4c3"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#f2f6ff}
      .title{font-size:38px;font-weight:750}.subtitle{font-size:18px;fill:#aebbd0}
      .head{font-size:22px;font-weight:700}.body{font-size:16px;fill:#d8e1f0}.small{font-size:14px;fill:#aebbd0}
      .box{rx:18;stroke-width:2}.flow{fill:none;stroke:#8294b2;stroke-width:3;marker-end:url(#arrow)}
      .selected{fill:none;stroke:#42d4c3;stroke-width:3;marker-end:url(#arrow-teal)}
      .feedback{fill:none;stroke:#8294b2;stroke-width:2;stroke-dasharray:9 8;marker-end:url(#arrow)}
      .label{font-size:13px;fill:#9fadc4;font-weight:650;letter-spacing:.3px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#0b1220"/>
  <text x="72" y="68" class="title">Web-use: one router, explicit ownership</text>
  <text x="72" y="103" class="subtitle">Portable policy selects a category. Local proof selects a provider. Narrow owners keep their authority.</text>

  <!-- Connectors first -->
  <path class="flow" d="M800 213V270"/>
  <path class="flow" d="M410 330H505"/>
  <path class="flow" d="M1095 330H1190"/>
  <path class="selected" d="M800 390V475"/>
  <path class="selected" d="M800 575V650"/>
  <path class="flow" d="M420 720H520"/>
  <path class="flow" d="M1180 720H1080"/>
  <path class="selected" d="M800 770V850"/>
  <path class="feedback" d="M1010 895H1335V785"/>

  <text x="818" y="438" class="label">LOAD ONE CATEGORY</text>
  <text x="818" y="618" class="label">FIT · PRIVACY · AUTHORITY</text>
  <text x="1122" y="882" class="label">RECORD DATED PROOF</text>

  <!-- Nodes -->
  <rect class="box" x="590" y="135" width="420" height="78" fill="#243756" stroke="#6fa8ff"/>
  <text x="800" y="169" class="head" text-anchor="middle">User request</text>
  <text x="800" y="195" class="body" text-anchor="middle">task shape · requested context · authority</text>

  <rect class="box" x="505" y="270" width="590" height="120" fill="#153e4c" stroke="#42d4c3"/>
  <text x="800" y="310" class="head" text-anchor="middle">web-use · routing authority</text>
  <text x="800" y="342" class="body" text-anchor="middle">choose category · choose context · recover from lane failure</text>
  <text x="800" y="370" class="small" text-anchor="middle">shared personal tabs remain explicit and consent-bound</text>

  <rect class="box" x="70" y="270" width="340" height="120" fill="#3a294d" stroke="#bf8cff"/>
  <text x="240" y="310" class="head" text-anchor="middle">Domain owners</text>
  <text x="240" y="342" class="body" text-anchor="middle">what · why · account · action policy</text>
  <text x="240" y="370" class="small" text-anchor="middle">shopping · food · X · travel · structured data</text>

  <rect class="box" x="1190" y="270" width="340" height="120" fill="#48331f" stroke="#f2b65a"/>
  <text x="1360" y="310" class="head" text-anchor="middle">Execution specialists</text>
  <text x="1360" y="342" class="body" text-anchor="middle">how the selected lane operates</text>
  <text x="1360" y="370" class="small" text-anchor="middle">Perplexity · browser mechanics · extraction · GUI</text>

  <rect class="box" x="520" y="475" width="560" height="100" fill="#183a60" stroke="#55aaff"/>
  <text x="800" y="515" class="head" text-anchor="middle">Selective category reference</text>
  <text x="800" y="547" class="body" text-anchor="middle">research · browser context · extraction · proof policy</text>

  <rect class="box" x="520" y="650" width="560" height="120" fill="#1d334d" stroke="#42d4c3"/>
  <text x="800" y="690" class="head" text-anchor="middle">Provider + proof gate</text>
  <text x="800" y="722" class="body" text-anchor="middle">task fit → privacy → authority → proven + available</text>
  <text x="800" y="750" class="small" text-anchor="middle">then choose the lowest local numeric priority</text>

  <rect class="box" x="70" y="635" width="350" height="150" fill="#23344e" stroke="#7d94bb"/>
  <text x="245" y="678" class="head" text-anchor="middle">Public portable contract</text>
  <text x="245" y="710" class="body" text-anchor="middle">categories · provider classes · templates</text>
  <text x="245" y="738" class="body" text-anchor="middle">privacy boundaries · tests · backlinks</text>
  <text x="245" y="766" class="small" text-anchor="middle">shareable through SkillReef</text>

  <rect class="box" x="1180" y="635" width="350" height="150" fill="#43272f" stroke="#ff7f92"/>
  <text x="1355" y="678" class="head" text-anchor="middle">Private per-machine truth</text>
  <text x="1355" y="710" class="body" text-anchor="middle">numeric priority · installed providers</text>
  <text x="1355" y="738" class="body" text-anchor="middle">profiles · balances · dated proof · blockers</text>
  <text x="1355" y="766" class="small" text-anchor="middle">never published or inherited</text>

  <rect class="box" x="555" y="850" width="490" height="90" fill="#173f3d" stroke="#42d4c3"/>
  <text x="800" y="887" class="head" text-anchor="middle">Verified intended result</text>
  <text x="800" y="918" class="small" text-anchor="middle">final state checked · capability claim stays evidence-backed</text>
</svg>
